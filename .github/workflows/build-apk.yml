name: Build eKashbuy APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ekashbuy-cloud-build-ready.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q ekashbuy-cloud-build-ready.zip -d source
        - name: Add Firebase configuration
          run: |
            cp google-services.json source/app/google-services.json
            test -s source/app/google-services.json
      - name: Prepare debug keystore
        run: |
          if [ -f source/debug.keystore.base64 ]; then
            echo "Restoring debug keystore from source/debug.keystore.base64"
            base64 -d source/debug.keystore.base64 > source/debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            echo "Restoring debug keystore from repository root debug.keystore.base64"
            base64 -d debug.keystore.base64 > source/debug.keystore
          elif [ ! -f source/debug.keystore ]; then
            echo "No debug.keystore.base64 found; generating temporary debug keystore"
            keytool -genkeypair -noprompt \
              -keystore source/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s source/debug.keystore
          keytool -list -v -keystore source/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true

      - name: Build APK
        run: gradle -p source :app:assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: eKashbuy-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
