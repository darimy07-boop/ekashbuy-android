name: Build eKashbuy APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ekashbuy-cloud-build-ready.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q ekashbuy-cloud-build-ready.zip -d source

             - name: Restore debug keystore
        run: |
          test -f debug.keystore.base64
          base64 -d debug.keystore.base64 > source/debug.keystore
          test -s source/debug.keystore
          ls -lh source/debug.keystore

      - name: Build APK
        run: gradle -p source :app:assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: eKashbuy-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
